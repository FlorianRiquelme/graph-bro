name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: node -e "console.log(process.version, process.platform, process.arch); console.log(require('better-sqlite3/package.json').version); new (require('better-sqlite3'))(':memory:').prepare('select 1').get()"

      - run: npm run build

      - run: npm test
